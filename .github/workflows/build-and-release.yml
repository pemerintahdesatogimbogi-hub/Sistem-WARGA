name: WARGA - Build APK Otomatis & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Upload APK ke GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  APK_NAME: WARGA-v1.8.0.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK Release
        working-directory: android
        run: gradle --no-daemon clean assembleRelease

      - name: Siapkan APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WARGA-v1.8.0-release
          path: dist/*
          retention-days: 30

      - name: Buat/Perbarui Release terbaru
        if: github.event_name == 'push' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-v1.8"
          TITLE="WARGA v1.8 - APK Terbaru"

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" \
            "dist/${APK_NAME}" \
            dist/SHA256SUMS.txt \
            --title "$TITLE" \
            --notes "APK WARGA v1.8 terbaru dari commit $GITHUB_SHA. Build otomatis GitHub Actions." \
            --latest=false
